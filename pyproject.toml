[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cassandra-ops-lab"
version = "0.1.0"
description = "Cassandra data-modeling portfolio project: query-first schema design, time-bucketed partitions, TTL/tombstone-aware compaction, consistency-level tradeoffs, and real 3-node failure/recovery testing."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["cassandra_ops_lab*"]
