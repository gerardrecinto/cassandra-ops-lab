services:
  cassandra-1:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    mem_limit: 1400m
    environment:
      CASSANDRA_CLUSTER_NAME: cassandra-ops-lab
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 500M
      HEAP_NEWSIZE: 100M

  cassandra-2:
    image: cassandra:5.0
    ports:
      - "9043:9042"
    mem_limit: 1400m
    environment:
      CASSANDRA_CLUSTER_NAME: cassandra-ops-lab
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 500M
      HEAP_NEWSIZE: 100M
    depends_on:
      - cassandra-1

  cassandra-3:
    image: cassandra:5.0
    ports:
      - "9044:9042"
    mem_limit: 1400m
    environment:
      CASSANDRA_CLUSTER_NAME: cassandra-ops-lab
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 500M
      HEAP_NEWSIZE: 100M
    depends_on:
      - cassandra-1
